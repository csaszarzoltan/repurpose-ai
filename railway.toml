# RepurposeAI — Railway deployment configuration
# AI-powered content repurposing tool — FastAPI web service.
# ──────────────────────────────────────────────────────────────────────
# Pattern source: shared/patterns/railway-deploy-config.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = 'sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"'

[environments.production.variables]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
PYTHONUNBUFFERED = "1"

[environments.staging.variables]
ENVIRONMENT = "staging"
LOG_LEVEL = "debug"
