# RepurposeAI — Railway deployment configuration
#
# AI-powered content repurposing tool — FastAPI web service.
# ──────────────────────────────────────────────────────────────────────

[build]
builder = "railpack"

[deploy]
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Memory and CPU are auto-allocated by Railpack on the free plan.
